    summary: |
      - 负责采购全流程数据管理与分析：独立执行从询价、报价跟踪到新物料价格维护的全流程数据工作，并通过制作月度调价报表、处理分析采购数据，为成本控制提供支持。
      - 主导跨部门沟通与协同：独立对接供应商及公司内部部门进行高效协调，并熟练操作供应商管理平台与 OA 系统，保障采购流程的顺畅与标准化。
