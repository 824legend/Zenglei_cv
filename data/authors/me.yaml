      - 全面预算管理：参与 2024 年度预算编制全流程，整理 2023 年历史费用数据并编制各部门预算收集表。
      - 专项财务管理：参与费用审批 SOP 流程和费用报销流程；协调部门完成政府补助申报材料汇编，助力公司成功获取成都市高新区"科技型中小企业发展专项资金"100 万元。
