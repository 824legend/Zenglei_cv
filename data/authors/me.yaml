experience:
  - role: 金融工程暑期实习生
    org: 深圳证券交易所 会员管理部
    start: 2026-07-01
    end: 2026-09-30
    summary: |
      - 围绕深市 ST 股票涨跌幅限制改革开展制度效果评估，基于改革前后股票交易数据构建指标体系，分析涨跌停约束、流动性及波动变化；发现改革后收盘涨停比例由 33.49% 下降至 2.63%，连续涨跌停显著减少，验证交易机制优化效果。
      - 开展最低订单停留时间制度国际研究，系统梳理欧美及亚洲主要市场监管实践，对 NASDAQ M-ELO、TSX Long Life Order 等订单机制进行比较分析，研究高频交易监管与市场微观结构优化路径。
      - SEC 订单生命周期研究。
  - role: 量化研究实习生
    org: 星云至恒（厦门）私募基金管理有限公司
    start: 2025-10-01
    end: 2026-05-31
    summary: |
      - 订单流交易研究与策略开发：系统梳理国内外订单流交易研报与学术文献，提炼市场微观结构核心逻辑；基于 DolphinDB 高频数据复现并优化订单流策略，完成回测验证与稳健性分析。
      - 高频数据建模与因子挖掘：运用 DolphinDB 处理多维度高频数据（逐笔交易、盘口数据等），开发并测试订单流不平衡等多个潜在套利因子，参与构建订单流驱动的套利模型。
      - 多资产配置策略研究（风险平价策略改进）：基于券商资产池构建多资产配置框架，复现多种风险平价改进模型并开展回测；其中 PCA 风险平价策略表现最优，年化收益 6.29%、最大回撤 1.15%、Sharpe 2.62、Calmar 5.45，并建立滚动跟踪机制。
      - 可转债多因子策略研究：构建可转债量化选券框架，融合估值、量价及正股特征因子，完成因子预处理、分层回测与策略对比，形成研究报告并提出优化建议。
      - 策略文档与团队协作：撰写策略复现报告与数据分析文档，清晰呈现研究假设、回测结果与改进方向，助力团队策略评审与决策。
  - role: 采购实习生
    org: 施耐德电气（厦门）开关设备有限公司
    start: 2025-07-01
